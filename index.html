    <!-- =====================================================
         TELA DE ENTRADA
         ===================================================== -->

    <main class="entrada" id="entrada">

        <!-- Efeito de luz vindo da superfície -->
        <div class="luz-oceano"></div>

        <!-- Pequenas partículas brilhantes -->
        <div class="particulas" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
        </div>

        <!-- Bolhas -->
        <div class="bolhas" aria-hidden="true">

            <span class="bolha bolha-1"></span>
            <span class="bolha bolha-2"></span>
            <span class="bolha bolha-3"></span>
            <span class="bolha bolha-4"></span>
            <span class="bolha bolha-5"></span>
            <span class="bolha bolha-6"></span>
            <span class="bolha bolha-7"></span>
            <span class="bolha bolha-8"></span>
            <span class="bolha bolha-9"></span>

        <!-- =================================================
             CONTEÚDO PRINCIPAL
             ================================================= -->

        <section class="conteudo-entrada">

            <!-- Espaço reservado para a futura sereia -->
            <div class="personagem" aria-label="Sereia">

                <div class="brilho-personagem"></div>

                <div class="silhueta-sereia">
                    <span class="cauda"></span>
                    <span class="corpo"></span>
                </div>

            </div>


            <!-- Pequeno elemento decorativo -->
            <div class="decoracao-superior">
                ✦
            </div>


            <!-- Nome -->
            <h1 class="nome-aniversariante">
                Sophia Emanuely
            </h1>


            <!-- Idade -->
            <div class="idade">
                <span>4</span>
                <small>ANOS</small>
            </div>


            <!-- Frase -->
            <p class="frase-entrada">
                Uma pequena aventura está prestes a começar...
            </p>


            <!-- Botão -->
            <button
                class="botao-entrada"
                id="botaoEntrada"
                type="button"
            >
                <span class="icone-botao">🌊</span>

                <span>
                    Entrar na aventura
                </span>

                <span class="seta-botao">→</span>
            </button>


            <!-- Indicação visual -->
            <div class="indicador">
                <span class="indicador-linha"></span>

                <span>
                    mergulhe para descobrir
                </span>

                <span class="indicador-linha"></span>
            </div>

        </section>


        <!-- =================================================
             ELEMENTOS DECORATIVOS DO FUNDO
             ================================================= -->

        <div class="coral coral-esquerda" aria-hidden="true">
            🪸
        </div>

        <div class="coral coral-direita" aria-hidden="true">
            🪸
        </div>

        <div class="concha-decorativa" aria-hidden="true">
            🐚
        </div>
