<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Convite especial para o aniversário de 4 anos de Sophia Emanuely."
    >

    <title>Sophia Emanuely — 4 Anos</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


    <!-- =====================================================
         TELA 1 — ENTRADA
         ===================================================== -->

    <main
        class="entrada"
        id="entrada"
    >


        <!-- =================================================
             FUNDO
             ================================================= -->

        <div
            class="fundo-oceano"
            aria-hidden="true"
        ></div>


        <!-- Luz suave vindo da superfície -->

        <div
            class="luz-superficie"
            aria-hidden="true"
        ></div>


        <!-- Profundidade do oceano -->

        <div
            class="profundidade-oceano"
            aria-hidden="true"
        ></div>



        <!-- =================================================
             PARTÍCULAS
             ================================================= -->

        <div
            class="particulas"
            aria-hidden="true"
        >

            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>
            <span></span>

        </div>



        <!-- =================================================
             BOLHAS
             ================================================= -->

        <div
            class="bolhas"
            aria-hidden="true"
        >

            <span class="bolha bolha-1"></span>
            <span class="bolha bolha-2"></span>
            <span class="bolha bolha-3"></span>
            <span class="bolha bolha-4"></span>
            <span class="bolha bolha-5"></span>
            <span class="bolha bolha-6"></span>
            <span class="bolha bolha-7"></span>
            <span class="bolha bolha-8"></span>

        </div>



        <!-- =================================================
             CONTEÚDO PRINCIPAL
             ================================================= -->

        <section
            class="conteudo-entrada"
            aria-labelledby="nomeAniversariante"
        >



            <!-- =================================================
                 PEQUENO ORNAMENTO
                 ================================================= -->

            <div
                class="ornamento-superior"
                aria-hidden="true"
            >

                <span class="linha-ornamento"></span>

                <span class="estrela-ornamento">
                    ✦
                </span>

                <span class="linha-ornamento"></span>

            </div>



            <!-- =================================================
                 SEREIA
                 ================================================= -->

            <div
                class="personagem"
                aria-label="Sereia"
            >


                <!-- brilho atrás da personagem -->

                <div
                    class="brilho-personagem"
                    aria-hidden="true"
                ></div>


                <!-- luz central -->

                <div
                    class="halo-personagem"
                    aria-hidden="true"
                ></div>


                <!-- personagem construída em CSS -->

                <div
                    class="sereia"
                    aria-hidden="true"
                >


                    <!-- cabelo -->

                    <div class="cabelo-sereia">

                        <span></span>
                        <span></span>
                        <span></span>

                    </div>


                    <!-- cabeça -->

                    <div class="cabeca-sereia">

                        <div class="rosto-sereia">

                            <span class="olho olho-esquerdo"></span>

                            <span class="olho olho-direito"></span>

                        </div>

                    </div>


                    <!-- corpo -->

                    <div class="corpo-sereia">

                        <div class="top-sereia"></div>

                        <div class="braco braco-esquerdo"></div>

                        <div class="braco braco-direito"></div>

                    </div>


                    <!-- cauda -->

                    <div class="cauda-sereia">

                        <div class="escamas-cauda"></div>

                    </div>


                    <!-- nadadeira -->

                    <div class="nadadeira-esquerda"></div>

                    <div class="nadadeira-direita"></div>


                </div>


            </div>



            <!-- =================================================
                 NOME
                 ================================================= -->

            <h1
                class="nome-aniversariante"
                id="nomeAniversariante"
            >

                Sophia Emanuely

            </h1>



            <!-- =================================================
                 IDADE
                 ================================================= -->

            <div class="idade">


                <span class="numero-idade">
                    4
                </span>


                <span class="texto-idade">
                    ANOS
                </span>


            </div>



            <!-- =================================================
                 FRASE
                 ================================================= -->

            <p class="frase-entrada">

                Uma pequena aventura está prestes
                a começar...

            </p>



            <!-- =================================================
                 BOTÃO
                 ================================================= -->

            <button
                class="botao-entrada"
                id="botaoEntrada"
                type="button"
            >


                <span class="texto-botao">

                    Entrar na aventura

                </span>


                <span
                    class="seta-botao"
                    aria-hidden="true"
                >

                    →

                </span>


            </button>



            <!-- =================================================
                 INDICADOR
                 ================================================= -->

            <div
                class="indicador-entrada"
                aria-hidden="true"
            >


                <span class="linha-indicador"></span>


                <span class="texto-indicador">

                    mergulhe para descobrir

                </span>


                <span class="linha-indicador"></span>


            </div>



        </section>



        <!-- =================================================
             SOMBRAS DECORATIVAS
             ================================================= -->

        <div
            class="sombra-fundo sombra-esquerda"
            aria-hidden="true"
        ></div>


        <div
            class="sombra-fundo sombra-direita"
            aria-hidden="true"
        ></div>



        <!-- =================================================
             BASE DA TELA
             ================================================= -->

        <div
            class="base-oceano"
            aria-hidden="true"
        >


            <span class="onda-fundo onda-1"></span>

            <span class="onda-fundo onda-2"></span>

            <span class="onda-fundo onda-3"></span>


        </div>


    </main>



    <!-- =====================================================
         JAVASCRIPT
         ===================================================== -->

    <script
        src="script.js"
    ></script>


</body>

</html>
