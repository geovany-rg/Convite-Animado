<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aniversário da Sophia Emanuely 🧜‍♀️✨</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Quicksand:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- CSS Principal -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <!-- Container do Mundo Submarino -->
    <main class="mundo-oceano">

        <!-- Raios de luz e camada de água -->
        <div class="efeito-luz-agua"></div>
        <div class="bolhas-oceano"></div>
        <div class="brilhos-oceano"></div>

        <!-- TELA DE ENTRADA (01) -->
        <section class="tela-entrada" id="entrada">
            <div class="conteudo-entrada">
                
                <div class="silhueta-sereia-distante">
                    <!-- Imagem ou SVG da Sereia -->
                    <span class="emoji-sereia">🧜‍♀️</span>
                </div>

                <h2 class="subtitulo-entrada">Uma pequena aventura está prestes a começar...</h2>
                <h1 class="titulo-aniversariante">Sophia Emanuely</h1>
                <p class="idade-destaque">✨ 4 ANOS ✨</p>

                <button id="btn-mergulhar" class="btn-oceanico">
                    <span>🌊 ENTRAR NO MUNDO DA SEREIA</span>
                </button>

            </div>
        </section>

        <!-- SEÇÃO HERO / APRESENTAÇÃO (02 - Preparada para o próximo passo) -->
        <section class="secao-hero surpresa-mergulho" id="hero">
            <div class="conteudo-hero">
                <div class="sereia-container">
                    <span class="sereia-personagem">🧜‍♀️</span>
                </div>
                <h2>🐚 Prepare-se para uma aventura encantada!</h2>
                <p class="texto-boas-vindas">
                    Bem-vindo ao oceano de encanto e magia da <strong>Sophia Emanuely</strong>!
                </p>
            </div>
        </section>

    </main>

    <!-- JavaScript Base -->
    <script src="js/script.js"></script>
</body>
</html>
